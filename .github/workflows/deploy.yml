name: Build and Deploy to VPS

on:
  push:
    branches:
      - vps-production
    paths:
      - 'apps/**'
      - 'docker-compose.production.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,branch=vps-production
            type=sha,prefix=
            type=raw,value=latest,enable=true

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push storefront image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/storefront
          file: ./apps/storefront/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/storefront:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment trigger file
        run: |
          echo "${{ github.sha }}" > deploy-commit.txt
          echo "${{ steps.meta.outputs.tags }}" > deploy-tags.txt

      - name: Upload deployment info
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: |
            deploy-commit.txt
            deploy-tags.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Download deployment info
        uses: actions/download-artifact@v4
        with:
          name: deployment-info

      - name: Read deployment info
        run: |
          COMMIT=$(cat deploy-commit.txt)
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV
          TAGS=$(cat deploy-tags.txt)
          echo "TAGS=$TAGS" >> $GITHUB_ENV

      - name: Debug SSH Key
        run: |
          echo "Checking SSH key setup..."
          ls -la ~/.ssh/ 2>/dev/null || echo "SSH dir not found"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/ecommerce
            echo "Pulling latest images..."
            GHCR_TOKEN=$(echo ${{ secrets.GITHUB_TOKEN }} | head -c 60)
            podman login ghcr.io -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
            podman-compose -f docker-compose.production.yml pull
            podman-compose -f docker-compose.production.yml up -d
            echo "Deployment complete!"