name: ecommerce-vps

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: ecommerce_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: vendure
      POSTGRES_USER: vendure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: ecommerce_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: ecommerce_server
    environment:
      - APP_ENV=production
      - PORT=3000
      - COOKIE_SECRET=${COOKIE_SECRET}
      - SUPERADMIN_USERNAME=${SUPERADMIN_USERNAME}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=vendure
      - DB_USERNAME=vendure
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - ASSET_URL_PREFIX=http://YOUR_VPS_IP:3000/assets/
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    container_name: ecommerce_storefront
    environment:
      - VENDURE_SHOP_API_URL=http://server:3000/shop-api
      - NEXT_PUBLIC_VENDURE_SHOP_API_URL=http://YOUR_VPS_IP:3000/shop-api
      - NEXT_PUBLIC_SITE_URL=http://YOUR_VPS_IP:3001
      - NEXT_PUBLIC_SITE_NAME=Ecommerce
      - REVALIDATION_SECRET=${REVALIDATION_SECRET}
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      - server

  dozzle:
    image: docker.io/amir20/dozzle:latest
    container_name: ecommerce_dozzle
    ports:
      - "8080:8080"
    volumes:
      - /run/podman/podman.sock:/var/run/docker.sock
    restart: unless-stopped

  beszel:
    image: docker.io/henrygd/beszel:latest
    container_name: ecommerce_beszel
    ports:
      - "8081:8080"
    volumes:
      - beszel_data:/data
      - /run/podman/podman.sock:/var/run/docker.sock
    environment:
      - BESZEL_PORT=8080
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  beszel_data: